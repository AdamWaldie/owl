// Skeleton and animations for owl.p3d.
//
// Named selections (bones) the P3D must contain, in the resolution LODs:
//   body, head, wing_l, wingtip_l, wing_r, wingtip_r
// Memory LOD points (two vertices each, forming the rotation axis):
//   axis_body      - nose to tail through the centre of mass (banking)
//   axis_head      - vertical through the neck (head turn)
//   axis_wing_l    - along the left shoulder joint, front to back
//   axis_wingtip_l - along the left wrist joint, front to back
//   axis_wing_r / axis_wingtip_r - same for the right side, also front to back
//
// tools/blender/prepare_owl.py builds these selections and points from the
// source rig. All animations use source "user" and are driven per frame by
// zom_fnc_animateOwl with `animate [name, phase, true]`. Phase 0..1:
//   wing_*/wingtip_*: 0 = top of upstroke, 1 = bottom of downstroke
//   body_bank:        0 = full left bank, 0.5 = level, 1 = full right bank
//   head_turn:        0 = looking left, 0.5 = forward, 1 = looking right

class CfgSkeletons {
    class Default {
        isDiscrete = 1;
        skeletonInherit = "";
        skeletonBones[] = {};
    };
    class zom_owl_skeleton: Default {
        isDiscrete = 0;
        skeletonBones[] = {
            "body",      "",
            "head",      "body",
            "wing_l",    "body",
            "wingtip_l", "wing_l",
            "wing_r",    "body",
            "wingtip_r", "wing_r"
        };
    };
};

class CfgModels {
    class Default {
        sectionsInherit = "";
        sections[] = {};
        skeletonName = "";
    };
    class owl: Default {
        skeletonName = "zom_owl_skeleton";
        sections[] = {};

        class Animations {
            class rot_base {
                type = "rotation";
                source = "user";
                sourceAddress = "clamp";
                minValue = 0;
                maxValue = 1;
                memory = 1;
            };

            // Owl wingbeat: deep, rounded stroke. Right side mirrors left
            // because both axes run front to back.
            class wing_flap_l: rot_base {
                selection = "wing_l";
                axis = "axis_wing_l";
                angle0 = "rad 45";
                angle1 = "rad -35";
            };
            class wing_flap_r: wing_flap_l {
                selection = "wing_r";
                axis = "axis_wing_r";
                angle0 = "rad -45";
                angle1 = "rad 35";
            };
            // Wingtips lag behind and fold slightly on the upstroke.
            class wingtip_flap_l: rot_base {
                selection = "wingtip_l";
                axis = "axis_wingtip_l";
                angle0 = "rad 25";
                angle1 = "rad -15";
            };
            class wingtip_flap_r: wingtip_flap_l {
                selection = "wingtip_r";
                axis = "axis_wingtip_r";
                angle0 = "rad -25";
                angle1 = "rad 15";
            };

            class body_bank: rot_base {
                selection = "body";
                axis = "axis_body";
                angle0 = "rad -30";
                angle1 = "rad 30";
            };
            class head_turn: rot_base {
                selection = "head";
                axis = "axis_head";
                angle0 = "rad -70";
                angle1 = "rad 70";
            };
        };
    };
};
